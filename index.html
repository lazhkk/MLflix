<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Streaming</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MENU SUPERIOR -->
<header class="navbar">
    <div class="logo">LOVEFLIX</div>

    <div class="perfil">
        <img src="Imagens/perfil.jpeg" class="fotoPerfil">
    </div>
</header>


<!-- BANNER PRINCIPAL -->
<section class="banner">
    <div class="banner-conteudo">
        <h1>Bem-vindo ao nosso Streaming</h1>
        <p>Os nossos melhores momentos em um só lugar.</p>
        <p>Para assistir quando quiser !</p>

        <button class="btnAssistir">
            ▶ Assistir Agora
        </button>
    </div>
</section>


<!-- CONTEÚDO -->
<main class="container">

    <section class="lista">
        <h2>Filmes em Alta</h2>
        <div id="listaFilmes" class="carrossel"></div>
    </section>

    <section class="lista">
        <h2>Séries em Alta</h2>
        <div id="listaSeries" class="carrossel"></div>
    </section>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
